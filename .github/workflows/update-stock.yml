name: Update GU snapshot
on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gu-data-refresh
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --disable-pip-version-check selenium
      - name: Render and extract GU data
        run: |
          set +e
          python scripts/fetch_gu.py > data/run.log 2>&1
          code=$?
          echo "exit_code=$code" >> data/run.log
          exit 0
      - name: Commit changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json data/run.log
          git diff --cached --quiet || git commit -m "data: refresh GU sale snapshot"
          git push
