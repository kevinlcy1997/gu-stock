name: Probe GU stock API

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-stock.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gu-stock-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch one SKU store stock
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          PRODUCT_CODE = "u0000000005919"
          SKU_CODE = "u0000000005919001"
          ITEM_NO = "359821"
          COLOR = "01 OFF WHITE"
          SIZE = "S"
          ENDPOINT = "https://d.gu-global.com/hk/p/store/site/stock"
          PRODUCT_URL = (
              "https://www.gu-global.com/hk/zh_HK/product-detail.html"
              f"?productCode={PRODUCT_CODE}"
          )

          payload = json.dumps({
              "state": "",
              "city": "",
              "district": "",
              "skuCode": SKU_CODE,
          }).encode("utf-8")
          request = urllib.request.Request(
              ENDPOINT,
              data=payload,
              method="POST",
              headers={
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "Origin": "https://www.gu-global.com",
                  "Referer": PRODUCT_URL,
                  "User-Agent": "Mozilla/5.0",
                  "langCode": "zh_HK",
              },
          )

          result = {
              "testedAt": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "endpoint": ENDPOINT,
              "productCode": PRODUCT_CODE,
              "skuCode": SKU_CODE,
              "itemNo": ITEM_NO,
              "color": COLOR,
              "size": SIZE,
          }

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = json.loads(response.read().decode("utf-8"))
                  result["httpStatus"] = response.status
              result["success"] = body.get("success") is True
              result["msgCode"] = body.get("msgCode")
              result["stores"] = [
                  {
                      "siteCode": store.get("siteCode"),
                      "siteName": store.get("siteName"),
                      "districtName": store.get("districtName"),
                      "siteStock": store.get("siteStock"),
                  }
                  for store in body.get("resp", [])
                  if store.get("siteCode")
              ]
              result["storeCount"] = len(result["stores"])
          except Exception as exc:
              result["success"] = False
              result["error"] = f"{type(exc).__name__}: {exc}"[:1000]

          out = Path("data/stock-probe.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "httpStatus": result.get("httpStatus"),
              "success": result.get("success"),
              "storeCount": result.get("storeCount"),
              "error": result.get("error"),
          }, ensure_ascii=False))
          if not result.get("success"):
              raise SystemExit(1)
          PY

      - name: Commit probe result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock-probe.json
          git diff --cached --quiet || git commit -m "data: capture GU store stock"
          git pull --rebase origin main
          git push
